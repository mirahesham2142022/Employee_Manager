<form class="panel" #departmentForm="ngForm" (ngSubmit)="submit(departmentForm)">
  <div class="form-header">
    <h2>{{ department === null ? 'Add department' : 'Edit department' }}</h2>
    <button class="close-button" type="button" aria-label="Close form" (click)="cancelled.emit()">×</button>
  </div>

  <label class="department-name-field">Department name
    <input name="departmentName" #nameField="ngModel" [(ngModel)]="name" required maxlength="100">
    @if (nameField.invalid && nameField.touched) {
      <span class="field-error">Department name is required.</span>
    }
  </label>

  <div class="form-actions">
    <button class="button secondary" type="button" (click)="cancelled.emit()">Cancel</button>
    <button class="button primary" type="submit" [disabled]="saving">
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </div>
</form>
