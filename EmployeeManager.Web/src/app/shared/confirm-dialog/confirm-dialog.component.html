<div class="dialog-backdrop" (click)="cancelled.emit()">
  <div class="dialog-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h2>{{ title }}</h2>
      <button class="close-button" type="button" aria-label="Close dialog" (click)="cancelled.emit()">×</button>
    </div>
    <div class="dialog-body">
      <p>{{ message }}</p>
    </div>
    <div class="dialog-actions">
      <button class="button secondary" type="button" (click)="cancelled.emit()">Cancel</button>
      <button class="button primary delete-btn" type="button" (click)="confirmed.emit()">{{ confirmLabel }}</button>
    </div>
  </div>
</div>
