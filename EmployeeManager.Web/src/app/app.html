@if (auth.isLoggedIn()) {
  <main class="page">
    <header class="page-header">
      <div class="header-row">
        <div>
          <h1>Employee Manager</h1>
          <p>Manage employees and departments.</p>
        </div>
        <button type="button" class="logout" (click)="auth.logout()">Log out</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Sections">
      <button type="button" [class.active]="activeTab() === 'employees'"
              [attr.aria-current]="activeTab() === 'employees' ? 'page' : null"
              (click)="activeTab.set('employees')">Employees</button>
      <button type="button" [class.active]="activeTab() === 'departments'"
              [attr.aria-current]="activeTab() === 'departments' ? 'page' : null"
              (click)="activeTab.set('departments')">Departments</button>
    </nav>

    @if (activeTab() === 'employees') {
      <app-employees-page />
    } @else {
      <app-departments-page />
    }
  </main>
} @else {
  <main class="login-wrapper">
    <div class="login-card">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>

      <h1>Employee Manager</h1>
      <p class="subtitle">Welcome back! Sign in to access your dashboard.</p>

      <div class="divider">
        <span>Single Sign-On</span>
      </div>

      <div class="google-btn-wrapper">
        <div #googleBtn></div>
      </div>

      <p class="login-footer">🔒 Secure corporate sign-in</p>
    </div>
  </main>
}
